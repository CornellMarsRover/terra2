package = "cmr_rovernet"
executable = "armnet_node"
name = "armnet"
dependencies = []

[fault_handling]
restart_attempts = 2
restart_delay = 10

[node]
can_port = "/dev/serial/by-id/usb-mjbots_fdcanusb_D8957AFF-if00"
publish_hardware_joint_states = true
use_legacy_ik_command_mapping = true
start_in_moveit_mode = true
