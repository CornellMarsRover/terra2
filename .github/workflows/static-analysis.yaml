name: Static Analysis
on:
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: cornellmarsrover/dev:latest
      options: --user root
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Config git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v31

      - name: Get self packages
        id: get-self-packages
        uses: autowarefoundation/autoware-github-actions/get-self-packages@v1

      - name: Refresh ROS apt source
        run: |
          curl -fsSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu jammy main" > /etc/apt/sources.list.d/ros2-latest.list
          rm -f /etc/apt/sources.list.d/xpra.list

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip clang-format clang-tidy ros-humble-ros2-control ros-humble-ros2-controllers ros-humble-xacro ros-humble-controller-manager ros-humble-robot-state-publisher ros-humble-joint-state-broadcaster ros-humble-rviz2
          python3 -m pip install --no-cache-dir moteus pyserial-asyncio
          echo "$GITHUB_WORKSPACE/.github/ci" >> "$GITHUB_PATH"

      - name: Build
        if: ${{ steps.get-self-packages.outputs.self-packages != '' }}
        uses: autowarefoundation/autoware-github-actions/colcon-build@v1
        with:
          rosdistro: humble
          target-packages: ${{ steps.get-self-packages.outputs.self-packages }}

      - name: Clean compile commands
        id: clean_db
        run: bash scripts/clean_build_db_wd.sh

      - name: Static analysis
        id: analyze
        run: bash scripts/check_wd.sh "${{ steps.changed-files.outputs.all_changed_files }}"
