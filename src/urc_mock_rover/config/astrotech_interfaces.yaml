# Astrotech GCS interface contract (Phase 2a).
#
# Single source of truth for every topic, service, and action name the mock
# rover advertises and the Foxglove extension subscribes to. Nothing in this
# file is hardware-confirmed — see docs/phase2a_assumptions.md for the full
# assumption list and the TODO(astrotech-q-N) map.
#
# When an answer arrives, edit this file first, then grep
# `TODO(astrotech-q-N)` for code that consumes the changed section.
#
# The TypeScript mirror of this file lives at
# gcs/extensions/urc-astrotech-panels/src/interfaces.ts. Keep the two in sync
# manually — the file is small (<50 lines of TS) and runtime YAML parsing in
# the browser is not worth the dependency.

auger:
  # The auger lives on TWO moteus controllers (id=15 lead_screw, id=16 auger)
  # using Josh Pieper's `moteus` library — *not* Caitlin's CAN-FD library.
  # See docs/reference/auger_keys_test_harness.py for the upstream pattern.
  # Hold-to-act: GCS publishes AugerCommand at 10 Hz while a button is held;
  # the driver applies a 200 ms watchdog and zeros velocities on silence.
  cmd_topic: /astrotech/auger/cmd_vel
  cmd_type: cmr_msgs/AugerCommand
  cmd_watchdog_ms: 200
  state_topic: /astrotech/auger/state
  state_type: cmr_msgs/AugerState
  state_rate_hz: 20

mixing_servo:
  # CMR servo board on the same fdcanusb as the auger moteus stack
  # (can_id=26, servo_id=15). Two services drive it from the GCS:
  #   - set_angle: drive to a specific angle (deg, offset from home)
  #   - set_home:  declare the current physical position to be 0 deg
  # The Foxglove panel persists the three site offsets locally and calls
  # set_angle with whichever value is in the box for that button. See
  # docs/mixing_servo_bringup_handoff.md for the bench history.
  set_angle_service: /astrotech/mixing_servo/set_angle
  set_angle_type: cmr_msgs/SetMixingServoAngle
  set_home_service: /astrotech/mixing_servo/set_home
  set_home_type: std_srvs/Trigger
  state_topic: /astrotech/mixing_servo/state
  state_type: std_msgs/Int32
  state_rate_hz: 5
  # Real-driver config (only consulted when URC_MIXING_SERVO_REAL=1).
  real_port: /dev/serial/by-id/usb-mjbots_fdcanusb_8249C85D-if00
  real_can_id: 26
  real_servo_id: 15
  real_bitrate: 1000000
  # After sending a goto frame, the real driver sleeps move_settle_s
  # before returning success. Closing the port (or returning before the
  # chamber arrives) on this firmware can race the mechanical move and
  # leave it stopped mid-travel -- same race scripts/mixing_servo_min.py
  # works around with --hold-s. 5 s is enough for a full-range swing on
  # the bench rig (2026-05-08); raise if larger envelopes are needed.
  move_settle_s: 5.0

analysis:
  # TODO(astrotech-q-3): step set is unknown; mock generates generic names.
  # TODO(astrotech-q-4): sequence_id vs. site_num naming unresolved.
  # No pause/resume here — see docs/post_urc_backlog.md.
  action_type: cmr_msgs/RunAnalysisSequence
  num_steps: 5
  step_duration_sec: 2.0
  sequences:
    - id: 1
      action: /astrotech/analysis/run_sequence_1
    - id: 2
      action: /astrotech/analysis/run_sequence_2

raman:
  # TODO(astrotech-q-5): if a real driver exists in another repo with its
  # own message type, replace `type` here, regenerate the TS mirror, and
  # delete cmr_msgs/msg/RamanSpectrum.msg.
  topic: /astrotech/raman/spectrum
  type: cmr_msgs/RamanSpectrum
  rate_hz: 1.0
  wavenumber_min: 200.0
  wavenumber_max: 2000.0
  n_points: 1024
  mock_peaks_cm_inv: [1085.0, 1332.0, 1580.0]

env:
  # TODO(astrotech-q-6): same as Q5 — swap to external type if one exists.
  topic: /astrotech/env/sample
  type: cmr_msgs/EnvSample
  rate_hz: 1.0

# Camera feeds aren't published by the mock — the cmr_cv camera nodes
# launched by src/cmr_cams/launch/default.launch.py (rover-side) own
# /camN/image_raw, and the stereolabs zed_wrapper owns the ZED topics.
# See docs/operator_guide.md for the four-terminal bring-up procedure.
# Foxglove uses its built-in Image panel; the layouts pre-fill the
# topic IDs (/cam11, /cam12, /zed/zed_node/left/image_rect_color).
