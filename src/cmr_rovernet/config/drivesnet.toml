package = "cmr_rovernet"
executable = "usama_control_testing_node"
name = "drivesnet"
dependencies = []

[fault_handling]
restart_attempts = 2
restart_delay = 10

[node]
can_port = "/dev/ttyACM0"

timeout_s = 0.30
drive_rps = 4.0
watchdog_timeout_s = 0.5

drive_max_torque = 2.0

steer_max_torque = 3.0
steer_velocity_limit = 6.0

controller_deadzone = 0.1
command_timeout_s = 0.5
refresh_rate_hz = 10.0

autonomy_priority = true
manual_override_priority = true

capture_steer_zero_on_start = true
